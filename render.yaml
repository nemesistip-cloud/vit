services:
    - type: web
      name: vitnetwork
      runtime: python
      region: oregon
      plan: free
      buildCommand: bash scripts/build.sh
      startCommand: bash scripts/start_production.sh
      healthCheckPath: /ping
      envVars:
        - key: ENVIRONMENT
          value: production
        - key: DATABASE_URL
          fromDatabase:
            name: vit-postgres-v2
            property: connectionString
        - key: REDIS_URL
          fromService:
            type: redis
            name: vitnetwork-redis
            property: connectionString
        - key: JWT_SECRET_KEY
          sync: false
        - key: FOOTBALL_DATA_API_KEY
          sync: false
        - key: ODDS_API_KEY
          sync: false
        - key: PAYSTACK_SECRET_KEY
          sync: false
        - key: PAYSTACK_WEBHOOK_SECRET
          sync: false
        - key: STRIPE_SECRET_KEY
          sync: false
        - key: RESEND_API_KEY
          sync: false
        - key: GOOGLE_CLIENT_ID
          sync: false
        - key: FIREBASE_PROJECT_ID
          sync: false
        - key: FIREBASE_SERVICE_ACCOUNT_JSON
          sync: false
        - key: ADMIN_EMAIL
          sync: false
        - key: ADMIN_PASSWORD
          sync: false
        # ── Service integration URLs ─────────────────────────────
        - key: VIT_AI_URL
          value: https://vit-ai.onrender.com
        - key: TACHYON_URL
          value: https://vit-storage-4trt.onrender.com
        - key: VIT_AI_API_KEY
          sync: false
        # ── Frontend build-time service URLs (baked into Vite bundle) ────────
        - key: VITE_GATEWAY_URL
          value: https://vitnetwork-nls4.onrender.com
        - key: VITE_AI_URL
          value: https://vit-ai.onrender.com
        - key: VITE_STORAGE_URL
          value: https://vit-storage-4trt.onrender.com
        - key: VITE_CHAIN_URL
          value: https://vit-chain.onrender.com

    - type: worker
      name: vitnetwork-worker
      runtime: python
      region: oregon
      plan: free
      buildCommand: bash scripts/build.sh
      startCommand: bash scripts/start_worker.sh
      envVars:
        - key: ENVIRONMENT
          value: production
        - key: WORKER_MODE
          value: "true"
        - key: DATABASE_URL
          fromDatabase:
            name: vit-postgres-v2
            property: connectionString
        - key: REDIS_URL
          fromService:
            type: redis
            name: vitnetwork-redis
            property: connectionString
        - key: JWT_SECRET_KEY
          sync: false
        - key: FOOTBALL_DATA_API_KEY
          sync: false
        - key: ODDS_API_KEY
          sync: false
        - key: VIT_AI_URL
          value: https://vit-ai.onrender.com
        - key: TACHYON_URL
          value: https://vit-storage-4trt.onrender.com
        - key: VIT_AI_API_KEY
          sync: false
        # ── Frontend build-time service URLs (baked into Vite bundle) ────────
        - key: VITE_GATEWAY_URL
          value: https://vitnetwork-nls4.onrender.com
        - key: VITE_AI_URL
          value: https://vit-ai.onrender.com
        - key: VITE_STORAGE_URL
          value: https://vit-storage-4trt.onrender.com
        - key: VITE_CHAIN_URL
          value: https://vit-chain.onrender.com

databases:
    - name: vit-postgres-v2
      region: oregon
      plan: free

redis:
    - name: vitnetwork-redis
      region: oregon
      plan: free
      ipAllowList: []
