services:
  - type: web
    name: vit
    runtime: python
    region: oregon
    plan: starter

    buildCommand: bash scripts/build.sh
    startCommand: bash scripts/start_production.sh

    healthCheckPath: /health

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "5000"
      - key: USE_REAL_ML_MODELS
        value: "true"
      - key: ML_MODEL_CACHE_ENABLED
        value: "true"
      - key: ENABLED_AGENTS
        value: "performance-monitor,live-match-tracker,network-guardian,weight-optimizer,match-scout,oracle-node,kyc-screener"
      - key: ENABLED_MODELS
        value: "logistic_v2,poisson_v2,elo_v2,dixon_coles_v2,market_implied_v2"
      - key: BLOCKCHAIN_ENABLED
        value: "true"
      - key: AUTH_ENABLED
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: MAX_STAKE
        value: "0.05"
      - key: MIN_EDGE_THRESHOLD
        value: "0.02"
      - key: ADMIN_EMAIL
        value: admin@vit.network
      - key: ADMIN_USERNAME
        value: vit_admin
      - key: BASE_CHAIN_ID
        value: "8453"
      - key: JWT_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: vit-postgres
          property: connectionString
      - key: VIT_DATABASE_URL
        fromDatabase:
          name: vit-postgres
          property: connectionString
        sync: false
        sync: false
        sync: false
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: FOOTBALL_DATA_API_KEY
        sync: false
      - key: GCS_BUCKET_NAME
        sync: false
      - key: GCS_PROJECT_ID
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: vit-redis
          property: connectionString

  - type: web
    name: tachyon
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install fastapi uvicorn httpx
    startCommand: python3 -m tachyon.main
    envVars:
      - key: PORT
        value: "8080"
      - key: PYTHONPATH
        value: "."
  - type: redis
    name: vit-redis
    region: oregon
    plan: free
    ipAllowList: []

databases:
  - name: vit-postgres
    plan: free
