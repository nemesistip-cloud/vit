services:
  - type: web
    name: vit
    runtime: python
    region: ohio
    plan: starter

    buildCommand: bash scripts/build.sh
    startCommand: bash scripts/start_production.sh

    healthCheckPath: /ping

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: USE_REAL_ML_MODELS
        value: "false"
      - key: ML_MODEL_CACHE_ENABLED
        value: "false"
      # ── Agent configuration ────────────────────────────────────────────────
      # These 8 agents form the memory-safe core set for free/starter plans.
      # Use ENABLED_AGENTS=all to enable all 23 agents (requires more RAM).
      - key: ENABLED_AGENTS
        value: "performance-monitor,live-match-tracker,network-guardian,weight-optimizer,match-scout,oracle-node,kyc-screener,academic-tutor"
      # ── ML model configuration ─────────────────────────────────────────────
      # All 13 registered model keys. market_v2 = MarketImplied (not market_implied_v2).
      - key: ENABLED_MODELS
        value: "xgb_v2,lstm_v2,poisson_v2,hybrid_v2,transformer_v2,ensemble_v2,dixon_coles_v2,bayes_v2,market_v2,rf_v2,logistic_v2,elo_v2,llm_consensus_v2"
      - key: BLOCKCHAIN_ENABLED
        value: "true"
      - key: AUTH_ENABLED
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: MAX_STAKE
        value: "0.05"
      - key: MIN_EDGE_THRESHOLD
        value: "0.02"
      - key: ADMIN_EMAIL
        value: admin@vit.network
      - key: ADMIN_USERNAME
        value: vit_admin
      - key: BASE_CHAIN_ID
        value: "8453"
      - key: PYTHONOPTIMIZE
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      # ── TheSportsDB ────────────────────────────────────────────────────────
      # Free public key = "3". Upgrade to a paid key for higher rate limits.
      - key: THESPORTSDB_API_KEY
        value: "3"
      # ── Bootstrap ─────────────────────────────────────────────────────────
      # Months of historical data to backfill on first boot (fewer = faster boot)
      - key: BOOTSTRAP_MATCH_MONTHS
        value: "3"
      # ── Secrets (must be set manually in Render dashboard) ────────────────
      # CRITICAL: JWT_SECRET_KEY MUST be set — without it sessions are lost on every restart.
      - key: JWT_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: vit-postgres
          property: connectionString
      - key: VIT_DATABASE_URL
        fromDatabase:
          name: vit-postgres
          property: connectionString
      - key: ODDS_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: FOOTBALL_DATA_API_KEY
        sync: false
      - key: GCS_BUCKET_NAME
        sync: false
      - key: GCS_PROJECT_ID
        sync: false
      - key: GDRIVE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: DROPBOX_ACCESS_TOKEN
        sync: false
      - key: DROPBOX_APP_KEY
        sync: false
      - key: DROPBOX_APP_SECRET
        sync: false
      - key: DROPBOX_REFRESH_TOKEN
        sync: false
      - key: ONEDRIVE_CLIENT_ID
        sync: false
      - key: ONEDRIVE_CLIENT_SECRET
        sync: false
      - key: ONEDRIVE_TENANT_ID
        sync: false
      - key: ONEDRIVE_USER_ID
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: vit-redis
          property: connectionString

  - type: web
    name: tachyon
    runtime: python
    region: ohio
    plan: starter
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -m tachyon.main
    envVars:
      - key: PYTHONPATH
        value: "."
  - type: redis
    name: vit-redis
    region: ohio
    plan: free
    ipAllowList: []

databases:
  - name: vit-postgres
    plan: free
