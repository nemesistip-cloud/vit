services:
  - type: web
    name: vitnetwork
    runtime: python
    region: ohio
    plan: free
    buildCommand: bash scripts/build.sh
    startCommand: bash scripts/start_production.sh
    healthCheckPath: /ping
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vit-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: vitnetwork-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        sync: false

  - type: worker
    name: vitnetwork-worker
    runtime: python
    region: ohio
    plan: free
    buildCommand: bash scripts/build.sh
    startCommand: bash scripts/start_worker.sh
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: WORKER_MODE
        value: "true"
      - key: REDIS_URL
        fromService:
          type: redis
          name: vitnetwork-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: vit-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        sync: false

  - type: redis
    name: vitnetwork-redis
    region: ohio
    plan: free
    ipAllowList: []
