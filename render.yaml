services:
  - type: web
    name: vitnetwork
    runtime: python
    region: oregon
    plan: free
    buildCommand: bash scripts/build.sh
    startCommand: bash scripts/start_production.sh
    healthCheckPath: /ping
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vit-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: vitnetwork-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        sync: false
      - key: FOOTBALL_DATA_API_KEY
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: worker
    name: vitnetwork-worker
    runtime: python
    region: oregon
    plan: free
    buildCommand: bash scripts/build.sh
    startCommand: bash scripts/start_worker.sh
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: WORKER_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: vit-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: vitnetwork-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        sync: false
      - key: FOOTBALL_DATA_API_KEY
        sync: false
      - key: ODDS_API_KEY
        sync: false

databases:
  - name: vit-postgres
    region: oregon
    plan: free

  - type: redis
    name: vitnetwork-redis
    region: oregon
    plan: free
    ipAllowList: []
