# In-process schedulers and GitHub Actions handle periodic tasks; no paid
# background worker is defined here.
services:
    - type: web
      name: vit
      runtime: docker
      region: virginia
      plan: free
      numInstances: 1
      healthCheckPath: /ping
      envVars:
        - key: ENVIRONMENT
          value: production
        - key: CORS_ALLOWED_ORIGINS
          value: https://vit-fwjz.onrender.com
        - key: DATABASE_URL
          fromDatabase:
            name: vitnetwork
            property: connectionString
        - key: ENABLE_IN_PROCESS_SCHEDULERS
          value: "true"
        - key: REDIS_URL
          fromService:
            type: keyvalue
            name: vitnetwork-redis
            property: connectionString
        - key: SECRET_KEY
          sync: false
        - key: JWT_SECRET_KEY
          sync: false
        - key: VIT_TREASURY_PRIVATE_KEY
          sync: false
        - key: GENESIS_VALIDATOR_KEY
          sync: false
        - key: GENESIS_VALIDATOR_ADDRESS
          sync: false
        - key: GENESIS_VALIDATORS
          sync: false
        - key: FOOTBALL_DATA_API_KEY
          sync: false
        - key: ODDS_API_KEY
          sync: false
        - key: PAYSTACK_SECRET_KEY
          sync: false
        - key: PAYSTACK_WEBHOOK_SECRET
          sync: false
        - key: STRIPE_SECRET_KEY
          sync: false
        - key: RESEND_API_KEY
          sync: false
        - key: GOOGLE_CLIENT_ID
          sync: false
        - key: FIREBASE_PROJECT_ID
          sync: false
        - key: FIREBASE_SERVICE_ACCOUNT_JSON
          sync: false
        - key: ADMIN_EMAIL
          sync: false
        - key: ADMIN_PASSWORD
          sync: false
        - key: RENDER_API_KEY
          sync: false
        # ── Service integration URLs ─────────────────────────────
        - key: VIT_AI_URL
          value: https://vit-ai-z3d4.onrender.com
        - key: VIT_STORAGE_URL
          value: https://vitstorage.onrender.com
        - key: TACHYON_URL
          value: https://vitstorage.onrender.com
        - key: TACHYON_ENDPOINT
          value: https://vitstorage.onrender.com/api/tachyon
        - key: VIT_CHAIN_MODE
          value: external
        - key: VIT_CHAIN_URL
          value: https://vit-chain-5bd9.onrender.com
        - key: VIT_GATEWAY_URL
          value: https://vit-fwjz.onrender.com
        - key: SERVICE_TOKEN_SECRET
          sync: false
        - key: VIT_AI_API_KEY
          sync: false
        - key: VIT_STORAGE_API_KEY
          sync: false
        - key: P2P_NODE_ID
          sync: false
        - key: P2P_PUBLIC_KEY
          sync: false

    - type: keyvalue
      name: vitnetwork-redis
      region: virginia
      plan: free
      ipAllowList: []

databases:
  - name: vitnetwork
    region: virginia
    plan: free
