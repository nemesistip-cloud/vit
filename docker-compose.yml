services:
  vit-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgresql+asyncpg://vit_user:vit_password@db:5432/vit_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  vit-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.worker", "worker", "--loglevel=info"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://vit_user:vit_password@db:5432/vit_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  vit-tachyon:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "tachyon.main"]
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    depends_on:
      - vit-api

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=vit_user
      - POSTGRES_PASSWORD=vit_password
      - POSTGRES_DB=vit_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vit_user -d vit_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
