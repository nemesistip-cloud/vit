steps:
  # ── 1. Build Docker image ─────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: build
    args:
      - 'build'
      - '--cache-from'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/vit-repo/vit-network:latest'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/vit-repo/vit-network:$COMMIT_SHA'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/vit-repo/vit-network:latest'
      - '.'

  # ── 2. Push image to Artifact Registry ───────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: push-sha
    waitFor: ['build']
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/vit-repo/vit-network:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    id: push-latest
    waitFor: ['build']
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/vit-repo/vit-network:latest'

  # ── 3. Run database migrations ────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: migrate
    waitFor: ['push-sha']
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - 'vit-migrate'
      - '--region'
      - 'europe-west1'
      - '--wait'
    allowFailure: true

  # ── 4. Deploy VIT API (primary service) ──────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-api
    waitFor: ['push-sha']
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'vit'
      - '--image'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/vit-repo/vit-network:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--cpu'
      - '2'
      - '--memory'
      - '2Gi'
      - '--timeout'
      - '300'
      - '--concurrency'
      - '80'
      - '--set-env-vars'
      - 'ENVIRONMENT=production,USE_REAL_ML_MODELS=true,ML_MODEL_CACHE_ENABLED=true,PORT=8080'
      - '--set-secrets'
      - 'JWT_SECRET_KEY=vit-jwt-secret:latest,SECRET_KEY=vit-secret-key:latest,DATABASE_URL=vit-database-url:latest'
      - '--add-cloudsql-instances'
      - '$PROJECT_ID:europe-west1:vit-postgres'
      - '--service-account'
      - 'vit-api@$PROJECT_ID.iam.gserviceaccount.com'

  # ── 5. Deploy VIT Worker (background agents, Celery) ─────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-worker
    waitFor: ['push-sha']
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'vit-worker'
      - '--image'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/vit-repo/vit-network:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'
      - '--no-cpu-throttling'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '3'
      - '--cpu'
      - '2'
      - '--memory'
      - '4Gi'
      - '--command'
      - 'celery'
      - '--args'
      - '-A,app.worker,worker,--loglevel=info,--concurrency,4'
      - '--set-secrets'
      - 'JWT_SECRET_KEY=vit-jwt-secret:latest,SECRET_KEY=vit-secret-key:latest,DATABASE_URL=vit-database-url:latest,REDIS_URL=vit-redis-url:latest'
      - '--add-cloudsql-instances'
      - '$PROJECT_ID:europe-west1:vit-postgres'
      - '--service-account'
      - 'vit-worker@$PROJECT_ID.iam.gserviceaccount.com'

  # ── 6. Verify deployment health ───────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: healthcheck
    waitFor: ['deploy-api']
    entrypoint: bash
    args:
      - '-c'
      - |
        URL=$(gcloud run services describe vit --region europe-west1 --format 'value(status.url)')
        for i in 1 2 3 4 5; do
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" $${URL}/health || echo "000")
          echo "Health check attempt $${i}: HTTP $${STATUS}"
          if [ "$${STATUS}" = "200" ]; then
            echo "✅ VIT API is healthy at $${URL}"
            exit 0
          fi
          sleep 10
        done
        echo "❌ Health check failed after 5 attempts"
        exit 1

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/vit-repo/vit-network:$COMMIT_SHA'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/vit-repo/vit-network:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  substitutionOption: ALLOW_LOOSE

timeout: '1800s'

substitutions:
  _REGION: 'europe-west1'
  _SERVICE_NAME: 'vit'
