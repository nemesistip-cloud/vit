steps:
  # Build the multi-purpose image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/vit-network:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/vit-network:latest', '.']

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/vit-network:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/vit-network:latest']

  # Deploy API to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'vit'
      - '--image'
      - 'gcr.io/$PROJECT_ID/vit-network:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances'
      - '$PROJECT_ID:europe-west1:vit-postgres'
      - '--timeout'
      - '300'

  # Deploy Worker to Cloud Run (Always-on CPU recommended)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'vit-worker'
      - '--image'
      - 'gcr.io/$PROJECT_ID/vit-network:$COMMIT_SHA'
      - '--command'
      - 'celery'
      - '--args'
      - '-A,app.worker,worker,--loglevel=info'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--no-cpu-throttling'

  # Deploy Tachyon to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'vit-tachyon'
      - '--image'
      - 'gcr.io/$PROJECT_ID/vit-network:$COMMIT_SHA'
      - '--command'
      - 'python'
      - '--args'
      - '-m,tachyon.main'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/vit-network:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/vit-network:latest'
