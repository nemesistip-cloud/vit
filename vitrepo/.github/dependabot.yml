version: 2
updates:
  # ── Python dependencies (pip) ────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Africa/Lagos"
    open-pull-requests-limit: 5
    # Group minor + patch bumps together to reduce PR noise.
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch
    # Security-sensitive packages get individual PRs so they can be reviewed
    # separately and merged quickly if it's a CVE fix.
    ignore: []
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore(deps)"
      include: scope

  # ── GitHub Actions ───────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Africa/Lagos"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(actions)"
      include: scope
