name: "✨ Feature request"
description: "Propose a new feature or improvement."
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the feature as clearly as possible.

  - type: textarea
    id: problem
    attributes:
      label: "What problem does this solve?"
      description: "Describe the user need or gap this feature addresses."
      placeholder: "As a node operator, I currently have to ... which is painful because ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Proposed solution"
      description: "Describe the feature you'd like. Include API design, UI changes, or workflow changes if relevant."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives considered"
      description: "Any alternative approaches you've thought about."

  - type: dropdown
    id: area
    attributes:
      label: "Affected area"
      multiple: true
      options:
        - Authentication / Auth
        - Wallet / Payments
        - Blockchain / VITChain
        - Sports / Predictions
        - AI / ML
        - Observability
        - Infrastructure / CI/CD
        - API / Documentation
        - Explorer
        - Node Registry
        - Governance
        - Other

  - type: textarea
    id: context
    attributes:
      label: "Additional context"
      description: "Screenshots, references, or ADR links."

  - type: checkboxes
    id: checklist
    attributes:
      label: "Before submitting"
      options:
        - label: "I searched existing issues and this is not a duplicate."
          required: true
        - label: "This aligns with the Engineering Constitution / project vision."
          required: false
