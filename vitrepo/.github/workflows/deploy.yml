name: Deploy to Google Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options: [production, staging]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west1
  REGISTRY: europe-west1-docker.pkg.dev
  REPOSITORY: vit-repo
  SERVICE_NAME: vit
  CLOUD_RUN_URL: https://vit-897838355273.europe-west1.run.app

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: |
          python -m pytest tests/ -x -q \
            --ignore=tests/test_live.py \
            --ignore=tests/test_env_example.py \
            -p no:warnings
        env:
          VIT_DATABASE_URL: sqlite+aiosqlite:///./test.db
          ENVIRONMENT: test
          AUTH_ENABLED: 'false'
          USE_REAL_ML_MODELS: 'false'

  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build Docker image
        run: |
          docker build \
            --cache-from ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/vit-network:latest \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/vit-network:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/vit-network:latest \
            .

      - name: Push image to Artifact Registry
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/vit-network:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/vit-network:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/vit-network:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 1 \
            --max-instances 10 \
            --cpu 2 \
            --memory 2Gi \
            --timeout 300 \
            --concurrency 80 \
            --set-env-vars "ENVIRONMENT=production,PORT=8080" \
            --set-secrets "JWT_SECRET_KEY=vit-jwt-secret:latest,SECRET_KEY=vit-secret-key:latest,DATABASE_URL=vit-database-url:latest" \
            --add-cloudsql-instances "${{ env.PROJECT_ID }}:${{ env.REGION }}:vit-postgres" \
            --service-account "vit-api@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"

      - name: Verify deployment health
        run: |
          echo "Waiting for service to stabilise..."
          sleep 15
          for i in 1 2 3 4 5; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" ${{ env.CLOUD_RUN_URL }}/health || echo "000")
            echo "Health check $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Deployment healthy: ${{ env.CLOUD_RUN_URL }}"
              exit 0
            fi
            sleep 10
          done
          echo "❌ Health check failed"
          exit 1

      - name: Summarise deployment
        if: success()
        run: |
          echo "## ✅ Deployment succeeded" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Service** | ${{ env.SERVICE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Region** | ${{ env.REGION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **URL** | ${{ env.CLOUD_RUN_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | ${{ github.event.head_commit.message }} |" >> $GITHUB_STEP_SUMMARY

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [test, build-and-deploy]
    if: failure()
    steps:
      - name: Post failure summary
        run: |
          echo "## ❌ Deployment failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs above for details. The previous deployment remains live." >> $GITHUB_STEP_SUMMARY
