name: Keep Render Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping vitnetwork-nls4.onrender.com
        run: |
          success=false
          for i in {1..3}; do
            echo "Attempt $i: Pinging vitnetwork-nls4.onrender.com..."
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://vitnetwork-nls4.onrender.com/ping)
            echo "/ping: $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "Service is alive."
              success=true
              break
            else
              echo "WARNING: /ping returned $STATUS"
              if [ $i -lt 3 ]; then
                echo "Retrying in 10 seconds..."
                sleep 10
              fi
            fi
          done

          if [ "$success" = false ]; then
            # Final check of the front page if /ping failed
            STATUS_FRONT=$(curl -s -o /dev/null -w '%{http_code}' https://vitnetwork-nls4.onrender.com/)
            echo "/: $STATUS_FRONT"

            if [ "$STATUS_FRONT" != "200" ] && [ "$STATUS_FRONT" != "301" ] && [ "$STATUS_FRONT" != "302" ]; then
               echo "ERROR: Service seems down or unreachable."
               false
            fi
          fi
