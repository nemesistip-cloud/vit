    "aiofiles>=23.0.0",
    "aiohttp>=3.9.0",
    "aioredis>=2.0.0",
    "aiosqlite>=0.19.0",
    "alembic>=1.13.0,<2.0.0",
    "asyncpg>=0.29.0",
    "bcrypt>=4.0.0,<5.0.0",
    "beautifulsoup4>=4.12.0",
    "celery>=5.3.0,<6.0.0",
    "coincurve>=18.0.0",
    "cryptography>=42.0.0",
    "dropbox>=11.36.0",
    "email-validator>=2.0",
    "eth-account>=0.8.0",
    "eth-hash[pycryptodome]>=0.5.1",
    "fakeredis>=2.21.0",
    "fastapi>=0.110.0,<1.0.0",
    "firebase-admin>=6.5.0",
    "fpdf2>=2.7.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.22.0",
    "google-auth-httplib2>=0.4.2",
    "google-cloud-secret-manager>=2.18.0",
    "greenlet>=3.0.0",
    "gunicorn>=21.0.0",
    "httpx>=0.27.0",
    "httplib2>=0.32.0",
    "itsdangerous>=2.1.0",
    "joblib>=1.3.0",
    "lxml>=5.0.0",
    "msal>=1.24.0",
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.0.0,<3.0.0",
    "passlib[bcrypt]>=1.7.4",
    "pgvector>=0.2.0",
    "pillow>=10.0.0",
    "psutil>=5.9.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "pyotp>=2.9.0",
    "python-dotenv>=1.0.0",
    "PyJWT>=2.10.1",
    "python-multipart>=0.0.9",
    "qrcode>=7.4.0",
    "redis>=5.0.0,<6.0.0",
    "reedsolo>=1.7.0",
    "reportlab>=4.0.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "semver>=3.0.0",
    "starlette>=0.36.0,<1.0.0",
    "stripe>=8.0.0",
    "tenacity>=8.2.0",
    "uvicorn[standard]>=0.29.0",
    "web3>=6.0.0",
    "websockets",
    "xgboost>=2.0.0",
    "apscheduler>=3.10.0,<4.0.0"
