<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060812"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="vgrad" x1="40" y1="20" x2="140" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#00F5FF"/>
      <stop offset="55%"  stop-color="#1E6BFF"/>
      <stop offset="100%" stop-color="#0033CC"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="apex-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bg-glow" cx="50%" cy="62%" r="42%">
      <stop offset="0%"   stop-color="#00F5FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="apex-halo" cx="50%" cy="90%" r="22%">
      <stop offset="0%"   stop-color="#00F5FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark background -->
  <rect width="180" height="180" rx="32" fill="url(#bg)"/>

  <!-- Ambient glows -->
  <ellipse cx="90" cy="112" rx="62" ry="46" fill="url(#bg-glow)"/>
  <ellipse cx="90" cy="158" rx="32" ry="18" fill="url(#apex-halo)"/>

  <!-- Outer triangle -->
  <path d="M90 18 L12 158 L168 158 Z" stroke="url(#vgrad)" stroke-width="3" stroke-opacity="0.28" fill="none"/>
  <!-- Second triangle -->
  <path d="M90 38 L22 148 L158 148 Z" stroke="url(#vgrad)" stroke-width="2" stroke-opacity="0.5" fill="none"/>

  <!-- Horizontal connector -->
  <line x1="40" y1="46" x2="140" y2="46" stroke="#00F5FF" stroke-width="1.4" stroke-opacity="0.3"/>

  <!-- Left arm V -->
  <line x1="40" y1="46" x2="90" y2="155" stroke="url(#vgrad)" stroke-width="11" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Right arm V -->
  <line x1="140" y1="46" x2="90" y2="155" stroke="url(#vgrad)" stroke-width="11" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Inner V left -->
  <line x1="62" y1="62" x2="90" y2="128" stroke="#00F5FF" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.85" filter="url(#glow)"/>
  <!-- Inner V right -->
  <line x1="118" y1="62" x2="90" y2="128" stroke="#00F5FF" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.85" filter="url(#glow)"/>

  <!-- Dots left arm -->
  <circle cx="55" cy="79"  r="3.5" fill="#00F5FF" fill-opacity="0.75"/>
  <circle cx="67" cy="100" r="2.5" fill="#00F5FF" fill-opacity="0.5"/>
  <circle cx="78" cy="121" r="3.5" fill="#00F5FF" fill-opacity="0.75"/>
  <!-- Dots right arm -->
  <circle cx="125" cy="79"  r="3.5" fill="#00F5FF" fill-opacity="0.75"/>
  <circle cx="113" cy="100" r="2.5" fill="#00F5FF" fill-opacity="0.5"/>
  <circle cx="102" cy="121" r="3.5" fill="#00F5FF" fill-opacity="0.75"/>

  <!-- Top-left node -->
  <circle cx="40" cy="46" r="7" fill="none" stroke="#00F5FF" stroke-width="2.8"/>
  <circle cx="40" cy="46" r="3.5" fill="#00F5FF"/>
  <line x1="12" y1="46" x2="33" y2="46" stroke="#00F5FF" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="12" cy="46" r="3" fill="#00F5FF" fill-opacity="0.5"/>

  <!-- Top-right node -->
  <circle cx="140" cy="46" r="7" fill="none" stroke="#00F5FF" stroke-width="2.8"/>
  <circle cx="140" cy="46" r="3.5" fill="#00F5FF"/>
  <line x1="147" y1="46" x2="168" y2="46" stroke="#00F5FF" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="168" cy="46" r="3" fill="#00F5FF" fill-opacity="0.5"/>

  <!-- Apex node -->
  <circle cx="90" cy="155" r="10" fill="none" stroke="#00F5FF" stroke-width="3.5" filter="url(#apex-glow)"/>
  <circle cx="90" cy="155" r="5" fill="#00F5FF" filter="url(#apex-glow)"/>
</svg>
