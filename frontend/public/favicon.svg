<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#050810"/>
    </radialGradient>
    <linearGradient id="hexfill" x1="30" y1="20" x2="150" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#00C8FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="cyangrad" x1="90" y1="20" x2="90" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#00F5C8"/>
      <stop offset="100%" stop-color="#00C8FF"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background with rounded rect -->
  <rect width="180" height="180" rx="36" fill="url(#bg)"/>

  <!-- Ambient glow field -->
  <circle cx="90" cy="90" r="82" fill="#00C8FF" fill-opacity="0.06"/>

  <!-- Outer hex ring (faint) -->
  <polygon points="90,10 161,50.5 161,129.5 90,170 19,129.5 19,50.5"
    stroke="#00C8FF" stroke-width="1.2" fill="none" opacity="0.20"/>

  <!-- Hex face -->
  <polygon points="90,22 152,57 152,123 90,158 28,123 28,57"
    stroke="#00C8FF" stroke-width="2.2" fill="url(#hexfill)" stroke-linejoin="round" opacity="0.95"/>

  <!-- Six hex vertex nodes -->
  <circle cx="90"  cy="22"  r="5.5" fill="#00F5C8" filter="url(#glow)" opacity="0.95"/>
  <circle cx="90"  cy="22"  r="2.5" fill="#fff"    opacity="0.85"/>
  <circle cx="152" cy="57"  r="4.5" fill="#00C8FF" filter="url(#glow)" opacity="0.80"/>
  <circle cx="152" cy="57"  r="2"   fill="#fff"    opacity="0.55"/>
  <circle cx="152" cy="123" r="4.5" fill="#00C8FF" filter="url(#glow)" opacity="0.80"/>
  <circle cx="152" cy="123" r="2"   fill="#fff"    opacity="0.55"/>
  <circle cx="90"  cy="158" r="4.5" fill="#00C8FF" filter="url(#glow)" opacity="0.80"/>
  <circle cx="90"  cy="158" r="2"   fill="#fff"    opacity="0.55"/>
  <circle cx="28"  cy="123" r="4.5" fill="#00C8FF" filter="url(#glow)" opacity="0.80"/>
  <circle cx="28"  cy="123" r="2"   fill="#fff"    opacity="0.55"/>
  <circle cx="28"  cy="57"  r="4.5" fill="#00C8FF" filter="url(#glow)" opacity="0.80"/>
  <circle cx="28"  cy="57"  r="2"   fill="#fff"    opacity="0.55"/>

  <!-- Radial spokes from centre (data network lines) -->
  <line x1="90" y1="90" x2="90"  y2="22"  stroke="#00C8FF" stroke-width="1" stroke-dasharray="3 7" opacity="0.28"/>
  <line x1="90" y1="90" x2="152" y2="57"  stroke="#7C3AED" stroke-width="1" stroke-dasharray="3 7" opacity="0.22"/>
  <line x1="90" y1="90" x2="152" y2="123" stroke="#00C8FF" stroke-width="1" stroke-dasharray="3 7" opacity="0.22"/>
  <line x1="90" y1="90" x2="90"  y2="158" stroke="#7C3AED" stroke-width="1" stroke-dasharray="3 7" opacity="0.22"/>
  <line x1="90" y1="90" x2="28"  y2="123" stroke="#00C8FF" stroke-width="1" stroke-dasharray="3 7" opacity="0.22"/>
  <line x1="90" y1="90" x2="28"  y2="57"  stroke="#7C3AED" stroke-width="1" stroke-dasharray="3 7" opacity="0.22"/>

  <!-- Inner delta triangle (V·I·T) -->
  <polygon points="90,44 122,101 58,101"
    stroke="url(#cyangrad)" stroke-width="2.8" stroke-linejoin="round" fill="none"
    filter="url(#glow)" opacity="0.92"/>
  <!-- Delta interior fill -->
  <polygon points="90,44 122,101 58,101" fill="#00F5C8" fill-opacity="0.08"/>

  <!-- Delta vertex marks -->
  <circle cx="90"  cy="44"  r="5"   fill="#00F5C8" filter="url(#glow)"  opacity="0.95"/>
  <circle cx="90"  cy="44"  r="2.2" fill="#fff"    opacity="0.90"/>
  <circle cx="122" cy="101" r="4.2" fill="#00C8FF" filter="url(#glow)"  opacity="0.88"/>
  <circle cx="122" cy="101" r="1.8" fill="#fff"    opacity="0.70"/>
  <circle cx="58"  cy="101" r="4.2" fill="#00C8FF" filter="url(#glow)"  opacity="0.88"/>
  <circle cx="58"  cy="101" r="1.8" fill="#fff"    opacity="0.70"/>

  <!-- Circuit crossbar mid-delta -->
  <line x1="64" y1="74" x2="116" y2="74"
    stroke="#00F5C8" stroke-width="1.5" stroke-dasharray="4 5" stroke-linecap="round" opacity="0.45"/>

  <!-- Central AI core pulse -->
  <circle cx="90" cy="90" r="13" fill="#00F5C8" fill-opacity="0.12" filter="url(#glow-strong)"/>
  <circle cx="90" cy="90" r="9"  fill="#00F5C8" fill-opacity="0.85" filter="url(#glow)"/>
  <circle cx="90" cy="90" r="4.5" fill="#fff"  opacity="0.90"/>
</svg>
