<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg512" cx="50%" cy="45%" r="70%">
      <stop offset="0%"   stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#050810"/>
    </radialGradient>
    <linearGradient id="hexfill512" x1="80" y1="55" x2="432" y2="457" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#00C8FF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="cyangrad512" x1="256" y1="60" x2="256" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#00F5C8"/>
      <stop offset="100%" stop-color="#00C8FF"/>
    </linearGradient>
    <filter id="glow512" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow512-strong" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="102" fill="url(#bg512)"/>

  <!-- Ambient glow -->
  <circle cx="256" cy="256" r="230" fill="#00C8FF" fill-opacity="0.05"/>
  <circle cx="256" cy="200" r="140" fill="#7C3AED" fill-opacity="0.04"/>

  <!-- Outer hex ring -->
  <polygon points="256,28 458,142 458,370 256,484 54,370 54,142"
    stroke="#00C8FF" stroke-width="3" fill="none" opacity="0.18"/>

  <!-- Hex face -->
  <polygon points="256,62 432,162 432,350 256,450 80,350 80,162"
    stroke="#00C8FF" stroke-width="6" fill="url(#hexfill512)" stroke-linejoin="round" opacity="0.95"/>

  <!-- Six hex vertex nodes -->
  <circle cx="256" cy="62"  r="15" fill="#00F5C8" filter="url(#glow512)" opacity="0.95"/>
  <circle cx="256" cy="62"  r="7"  fill="#fff"    opacity="0.90"/>
  <circle cx="432" cy="162" r="13" fill="#00C8FF" filter="url(#glow512)" opacity="0.82"/>
  <circle cx="432" cy="162" r="5.5" fill="#fff"   opacity="0.60"/>
  <circle cx="432" cy="350" r="13" fill="#00C8FF" filter="url(#glow512)" opacity="0.82"/>
  <circle cx="432" cy="350" r="5.5" fill="#fff"   opacity="0.60"/>
  <circle cx="256" cy="450" r="13" fill="#00C8FF" filter="url(#glow512)" opacity="0.82"/>
  <circle cx="256" cy="450" r="5.5" fill="#fff"   opacity="0.60"/>
  <circle cx="80"  cy="350" r="13" fill="#00C8FF" filter="url(#glow512)" opacity="0.82"/>
  <circle cx="80"  cy="350" r="5.5" fill="#fff"   opacity="0.60"/>
  <circle cx="80"  cy="162" r="13" fill="#00C8FF" filter="url(#glow512)" opacity="0.82"/>
  <circle cx="80"  cy="162" r="5.5" fill="#fff"   opacity="0.60"/>

  <!-- Radial spokes -->
  <line x1="256" y1="256" x2="256" y2="62"  stroke="#00C8FF" stroke-width="2.5" stroke-dasharray="8 18" opacity="0.28"/>
  <line x1="256" y1="256" x2="432" y2="162" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="8 18" opacity="0.22"/>
  <line x1="256" y1="256" x2="432" y2="350" stroke="#00C8FF" stroke-width="2.5" stroke-dasharray="8 18" opacity="0.22"/>
  <line x1="256" y1="256" x2="256" y2="450" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="8 18" opacity="0.22"/>
  <line x1="256" y1="256" x2="80"  y2="350" stroke="#00C8FF" stroke-width="2.5" stroke-dasharray="8 18" opacity="0.22"/>
  <line x1="256" y1="256" x2="80"  y2="162" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="8 18" opacity="0.22"/>

  <!-- Inner delta (V·I·T) -->
  <polygon points="256,126 348,288 164,288"
    stroke="url(#cyangrad512)" stroke-width="8" stroke-linejoin="round" fill="none"
    filter="url(#glow512)" opacity="0.92"/>
  <polygon points="256,126 348,288 164,288" fill="#00F5C8" fill-opacity="0.07"/>

  <!-- Delta vertex marks -->
  <circle cx="256" cy="126" r="14"  fill="#00F5C8" filter="url(#glow512)"  opacity="0.95"/>
  <circle cx="256" cy="126" r="6"   fill="#fff"    opacity="0.90"/>
  <circle cx="348" cy="288" r="12"  fill="#00C8FF" filter="url(#glow512)"  opacity="0.88"/>
  <circle cx="348" cy="288" r="5"   fill="#fff"    opacity="0.70"/>
  <circle cx="164" cy="288" r="12"  fill="#00C8FF" filter="url(#glow512)"  opacity="0.88"/>
  <circle cx="164" cy="288" r="5"   fill="#fff"    opacity="0.70"/>

  <!-- Mid crossbar -->
  <line x1="184" y1="210" x2="328" y2="210"
    stroke="#00F5C8" stroke-width="4" stroke-dasharray="10 13" stroke-linecap="round" opacity="0.42"/>

  <!-- Central AI core -->
  <circle cx="256" cy="256" r="38" fill="#00F5C8" fill-opacity="0.10" filter="url(#glow512-strong)"/>
  <circle cx="256" cy="256" r="26" fill="#00F5C8" fill-opacity="0.88" filter="url(#glow512)"/>
  <circle cx="256" cy="256" r="13" fill="#fff"    opacity="0.90"/>
</svg>
