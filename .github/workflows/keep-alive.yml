name: Keep Render Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Verify vitnetwork readiness
        run: |
          success=false
          for i in {1..3}; do
            echo "Attempt $i: Checking vitnetwork-nls4.onrender.com/ready..."
            STATUS=$(curl -s --max-time 15 -o /dev/null -w '%{http_code}' https://vitnetwork-nls4.onrender.com/ready || echo "000")
            echo "/ready: $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "Service is alive."
              success=true
              break
            else
              echo "WARNING: /ping returned $STATUS"
              if [ $i -lt 3 ]; then
                echo "Retrying in 10 seconds..."
                sleep 10
              fi
            fi
          done

          if [ "$success" = false ]; then
            echo "ERROR: Gateway readiness failed after 3 attempts."
            exit 1
          fi
