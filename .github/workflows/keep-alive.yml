name: Keep Render Alive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping vit-hmt1.onrender.com
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://vit-hmt1.onrender.com/ping)
          echo "/ping: $STATUS"
          STATUS_FRONT=$(curl -s -o /dev/null -w "%{http_code}" https://vit-hmt1.onrender.com/)
          echo "/: $STATUS_FRONT"
          if [ "$STATUS" != "200" ]; then
            echo "WARNING: /ping returned $STATUS"
          else
            echo "Service is alive."
          fi