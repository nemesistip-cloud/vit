name: Keep Render Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake vitnetwork and verify the gateway
        run: |
          for i in $(seq 1 8); do
            echo "Attempt $i/8: checking the lightweight gateway health endpoint..."
            STATUS=$(curl -sS --connect-timeout 10 --max-time 20 \
              -o /dev/null -w '%{http_code}' \
              https://vitnetwork-nls4.onrender.com/ping || true)
            STATUS="${STATUS:-000}"
            echo "/ping: HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "Gateway responded successfully."
              echo "Keep-alive succeeded on attempt $i (HTTP $STATUS)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            if [ "$i" -lt 8 ]; then
              echo "Gateway has not woken yet; retrying in 10 seconds..."
              sleep 10
            fi
          done

          echo "::error::Gateway did not respond successfully after 8 wake attempts."
          echo "Keep-alive failed after 8 attempts to GET /ping. Check Render service events and logs for the wake failure." >> "$GITHUB_STEP_SUMMARY"
          exit 1
