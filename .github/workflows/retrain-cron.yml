name: Retrain Models Cron

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install .

      - name: Run retrain script
        env:
          TACHYON_STORAGE_ENABLED: ${{ secrets.VIT_STORAGE_API_KEY != '' && secrets.SERVICE_TOKEN_SECRET != '' }}
          TACHYON_ENDPOINT: 'https://vitstorage.onrender.com/api/tachyon'
          VIT_STORAGE_API_KEY: ${{ secrets.VIT_STORAGE_API_KEY }}
          SERVICE_TOKEN_SECRET: ${{ secrets.SERVICE_TOKEN_SECRET }}
          PYTHONPATH: backend
        run: python scripts/retrain_cron.py
