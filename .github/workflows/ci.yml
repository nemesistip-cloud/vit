name: CI — Lint, Type-check, Tests

# Required check on every PR targeting main.
# Merge is blocked until this passes.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]   # also run on direct pushes so the badge stays accurate

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check . --output-format=github

  type-check:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies + mypy
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy types-redis types-passlib types-python-jose

      - name: Run mypy
        # Check the core app package only; third-party stubs are optional.
        # --ignore-missing-imports lets CI pass even for libs without stubs.
        run: |
          mypy app/ vit_chain/ \
            --ignore-missing-imports \
            --no-error-summary \
            --pretty \
            || true   # non-blocking until baseline is established
        env:
          ENVIRONMENT: test

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit & smoke tests
        # Excludes:
        #  - tests/test_live.py        — live prod endpoints
        #  - tests/test_env_example.py — just validates .env.example format
        # Marker filter:
        #  - not live        — tests that hit external services (iSports, Paystack, etc.)
        #  - not integration — tests that require a real, pre-migrated database
        run: |
          python -m pytest tests/ -q \
            --ignore=tests/test_live.py \
            --ignore=tests/test_env_example.py \
            -m "not live and not integration" \
            --tb=short \
            -p no:warnings \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=0
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          ENVIRONMENT: test
          AUTH_ENABLED: 'false'
          USE_REAL_ML_MODELS: 'false'
          RATE_LIMIT_ENABLED: 'false'
          JWT_SECRET_KEY: 'ci-test-secret-key-not-for-production'
          SESSION_SECRET: 'ci-test-session-secret'
          PAYSTACK_SECRET_KEY: 'sk_test_placeholder'
          PAYSTACK_WEBHOOK_SECRET: 'whsec_test_placeholder'

    typecheck-frontend:
      name: Type-check frontend (tsc)
      runs-on: ubuntu-latest
      # Blocking job — prevents broken TypeScript reaching Render.
      # (4 failed deploys 2026-07-18 were all undetected TS errors.)
      steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-node@v4
          with:
            node-version: '20'

        - name: Install pnpm
          run: npm install -g pnpm@9

        - name: Install frontend dependencies
          run: pnpm install --frozen-lockfile

        - name: TypeScript compiler check (noEmit)
          run: cd frontend && pnpm exec tsc --noEmit
    