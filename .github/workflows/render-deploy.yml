name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: render-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  SERVICE_URL: https://vitnetwork-nls4.onrender.com

jobs:
  deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy via Render API
        run: |
          SERVICE_ID="${{ secrets.RENDER_SERVICE_ID }}"
          SERVICE_ID="${SERVICE_ID:-srv-d8sipgjeo5us73eis7hg}"
          API_KEY="${{ secrets.RENDER_API_KEY }}"
          if [[ -z "$SERVICE_ID" || -z "$API_KEY" ]]; then
            echo "Render API trigger secrets are not configured; autoDeploy:yes will handle this push."
            exit 0
          fi
          echo "Triggering deploy for ${{ secrets.RENDER_SERVICE_ID }}..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $API_KEY" \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys")
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")
          echo "Status: $HTTP_STATUS"
          echo "Body: $BODY"
          if [ "$HTTP_STATUS" = "401" ] || [ "$HTTP_STATUS" = "403" ]; then
            echo "⚠️  Render API auth failed (HTTP $HTTP_STATUS) — autoDeploy:yes handles deploy automatically."
            echo "   Check RENDER_API_KEY + RENDER_SERVICE_ID secrets if manual trigger is required."
            exit 0
          fi
          if [ "$HTTP_STATUS" != "201" ] && [ "$HTTP_STATUS" != "202" ] && [ "$HTTP_STATUS" != "200" ]; then
            echo "Deploy trigger failed (HTTP $HTTP_STATUS)" && exit 1
          fi
          DEPLOY_ID=$(echo "$BODY" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          echo "Deploy triggered: $DEPLOY_ID"

      - name: Wait for the requested commit to be live
        env:
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          SERVICE_ID="${SERVICE_ID:-srv-d8sipgjeo5us73eis7hg}"
          if [[ -z "$API_KEY" ]]; then
            echo "Render API key is unavailable; commit-specific deployment verification is blocked."
            exit 1
          fi

          echo "Waiting for Render to serve commit $GITHUB_SHA..."
          for i in $(seq 1 40); do
            DEPLOYS=$(curl -fsS --max-time 15 \
              -H "Authorization: Bearer $API_KEY" \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys?limit=20" || true)
            if [[ -n "$DEPLOYS" ]]; then
              MATCH=$(jq -c --arg sha "$GITHUB_SHA" '
                (if type == "array" then . else [.] end)
                | map(.deploy // .)
                | map(select((.commit.id // .commitId // .commit_id // "") == $sha))
                | first // empty
              ' <<< "$DEPLOYS")
              STATUS=$(jq -r '.status // empty' <<< "$MATCH" 2>/dev/null || true)
              echo "Attempt $i/40: commit status ${STATUS:-not listed}"

              if [[ "$STATUS" == "live" ]]; then
                echo "Render reports $GITHUB_SHA is live."
                exit 0
              fi
              if [[ "$STATUS" == "build_failed" || "$STATUS" == "update_failed" || "$STATUS" == "canceled" ]]; then
                echo "Render deployment ended with status $STATUS."
                exit 1
              fi
            else
              echo "Attempt $i/40: deployment record not available"
            fi
            sleep 15
          done

          echo "Render did not report $GITHUB_SHA as live within 10 minutes."
          exit 1

      # Health gate: poll /ready until dependencies are healthy or 5 minutes have elapsed.
      # Docker builds on Render (free tier) take 3-6 min end-to-end.
      # We poll every 15 s for up to 20 attempts (= 5 min max) without
      # an upfront sleep so fast deploys pass immediately.
      - name: Health gate — wait for /ready to return 200
        run: |
          echo "Polling ${{ env.SERVICE_URL }}/ready (up to 5 min, every 15s)..."
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 15 \
              "${{ env.SERVICE_URL }}/ready" || echo "000")
            echo "Attempt $i/20: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Service is ready: ${{ env.SERVICE_URL }}"
              exit 0
            fi
            sleep 15
          done

          echo "❌ Readiness gate failed — /ready did not return 200 within 5 min."
          echo "Check the Render dashboard: https://dashboard.render.com/web/srv-d8sipgjeo5us73eis7hg"
          exit 1

      - name: Summary
        if: always()
        run: |
          echo "## Render deploy" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **URL** | ${{ env.SERVICE_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
