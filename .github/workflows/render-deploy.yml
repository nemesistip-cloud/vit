name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: render-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  SERVICE_URL: https://vitnetwork-nls4.onrender.com

jobs:
  deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy via Render API
        run: |
          echo "Triggering deploy for ${{ secrets.RENDER_SERVICE_ID }}..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -d '{"clearCache":"do_not_clear"}')
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")
          echo "Status: $HTTP_STATUS"
          echo "Body: $BODY"
          if [ "$HTTP_STATUS" != "201" ] && [ "$HTTP_STATUS" != "200" ]; then
            echo "Deploy trigger failed (HTTP $HTTP_STATUS)" && exit 1
          fi
          DEPLOY_ID=$(echo "$BODY" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          echo "Deploy triggered: $DEPLOY_ID"

      # Health gate: poll /ping until healthy or 5 minutes have elapsed.
        # Docker builds on Render (free tier) take 3-6 min end-to-end.
        # We poll every 15 s for up to 20 attempts (= 5 min max) without
        # an upfront sleep so fast deploys pass immediately.
        - name: Health gate — wait for /ping to return 200
          run: |
            echo "Polling ${{ env.SERVICE_URL }}/ping (up to 5 min, every 15s)..."
            for i in $(seq 1 20); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                --max-time 15 \
                "${{ env.SERVICE_URL }}/ping" || echo "000")
              echo "Attempt $i/20: HTTP $STATUS"
              if [ "$STATUS" = "200" ]; then
                echo "✅ Service is healthy: ${{ env.SERVICE_URL }}"
                exit 0
              fi
              sleep 15
            done

            echo "❌ Health gate failed — /ping did not return 200 within 5 min."
            echo "Check the Render dashboard: https://dashboard.render.com/web/srv-d8sipgjeo5us73eis7hg"
            exit 1

      - name: Summary
        if: always()
        run: |
          echo "## Render deploy" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **URL** | ${{ env.SERVICE_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
