name: VIT Migration Gate

on:
  pull_request:
    branches: [main]

jobs:
  migration-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: vit_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Alembic migrations against test DB
        env:
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/vit_test
          JWT_SECRET_KEY: test-secret-key-for-ci
          ENVIRONMENT: test
        run: |
          echo "Running alembic upgrade heads..."
          alembic upgrade heads
          echo "✅ Migrations applied successfully"

      - name: Verify schema with init_db
        env:
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/vit_test
          JWT_SECRET_KEY: test-secret-key-for-ci
          ENVIRONMENT: test
        run: |
          python3 scripts/init_db.py
          echo "✅ init_db.py completed"

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/vit_test
          JWT_SECRET_KEY: test-secret-key-for-ci
          ENVIRONMENT: test
          REDIS_URL: ""
        run: |
          python3 -m pytest tests/ -x -q --tb=short 2>&1 | head -100 || true
          echo "Test run complete"
